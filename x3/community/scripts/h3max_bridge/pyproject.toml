[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3max-bridge"
version = "0.1.0"
description = "REA-Video breakdown.json to MiniMax-H3 10Eros-Max Beta 7 exporter and validator (RV2)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
h3max-bridge = "h3max_bridge.h3max_bridge:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/h3max_bridge"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
