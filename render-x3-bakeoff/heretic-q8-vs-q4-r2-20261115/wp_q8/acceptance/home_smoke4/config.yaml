# Render writer pipeline config (Max Architect 3, 2026-11-13, Derrick t1409u). Read by
# C:\AI\community\scripts\parody\render_writer_pipeline.py. Sampler frozen once at setup by the A/B (results in
# acceptance\sampler_ab.json); never re-tuned automatically.
version: wp-2026-11-13.1
endpoint: http://127.0.0.1:8085/v1      # GPU lock gate -> llama-swap; requests wait while a render holds the GPU lock
model_alias: gemma4_heretic_poly_think  # same served model as Render's pi chat (no llama-swap swap between Render and the pipeline)
thinking: false                         # chat_template_kwargs.enable_thinking (Gemma thinking is on/off only)
timeout_s: 900
retry_backoff_s: [10, 30, 90]
default_character: FCSydny
writer_prompt: writer_prompt.md          # relative to C:\AI\render\writer_pipeline
writer_prompt_sha256: SETUP            # filled at install; a change regenerates cloned_phrases.txt on the next run
persona: current                        # frozen by the persona arm (current | option1 | option2)
n_candidates: 3
tie_points: 3
sampler_arm: B                          # frozen by the sampler A/B
samplers:
  A:   # current production (PolyStrata server default)
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    min_p: 0.10
  B:   # spec arm B; DRY / XTC are not implemented by PolyStrata (serve/server.py sampling_keys), so they are not sent
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    min_p: 0.03
beat_card_sampler:
  temperature: 0.7
beat_card_max_tokens: 1400
prose_max_tokens: 1100
judge_sampler:   # temp 0 is not sendable to PolyStrata (temperature <= 0 falls back to the server default 1.0): top_k 1 = greedy
  temperature: 0.01
  top_k: 1
judge_seed: 1234567
blacklist_cap: 20
log_retention_days: 14
log_cap_mb: 50
scene_archive_days: 30
lint:
  speech_words_max: 25
  blacklist_ratio: 0.8
  words_min: 90
  words_max: 190
  pen_phase_no_sound: 5
position_kinds:   # a new builder act needs one line here (spec "Max, only on change")
  talk: [talk]
  oral: [blowjob, mmf_double_blowjob, ff_cunnilingus]
  solo: [female_solo, male_solo, tease, dance, titjob, finish]
  sex: [missionary, doggy, cowgirl, spooning, prone_bone, ff_scissoring, mf_anal, bondage, threesome, mmf, ffm, standing_mf, airplane, piledriver]
still_pool:
  - C:\AI\render\stills\approved_characters\POOL\**\*.jpg
  - C:\AI\render\stills\approved_characters\POOL\**\*.png
