[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-tool"
version = "0.1.0"
description = "Tiny H5 harness sample tool (offline check-all verification)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sample_tool"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
